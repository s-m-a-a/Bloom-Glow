<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details</title>
  <style>
    /*======================details-page======================== */
    body {
      background-color: rgb(254, 249, 252);
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    #product_details {
      display: grid;
      grid-template-columns: 0.7fr 1fr;
      max-width: 1000px;
      width: 90%;
      margin: 170px auto 190px auto;
      gap: 40px;
      background-color: transparent;
      padding: 20px;
      background: rgba(244, 153, 203, 0.222);
      border-radius: 15px;
      box-shadow: 0 8px 40px 0 rgba(162, 1, 122, 0.37);
      border: 2px solid rgba(255, 255, 255, 0.18);
    }

    .d-product-img {
      background-color: white;
      border: 2px solid #f6d9e9;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      overflow: hidden;
      transition: 0.3s ease;
      cursor: pointer;
    }

    .d-product-img:hover {
      transform: translateY(-4%);
      box-shadow: rgba(254, 175, 237, 0.992) 3px 13px 47px -5px,
        rgba(254, 244, 251, 0.803) 3px 8px 16px -8px;
    }

    .d-product-img img {
      width: 100%;
      max-height: 350px;
      height: 90%;
      object-fit: contain;
      object-position: center;
      border-radius: 30px;
    }

    .d-product-text {
      display: flex;
      flex-direction: column;
      padding: 0px 30px;
      justify-content: flex-start;
    }

    .d-product-text .category a {
      text-decoration: none;
      color: #ec26b1;
      font-size: 17px;
    }

    .d-product-text strong {
      color: #1b1b1d;
      font-weight: 800;
      font-size: 1.8rem;
      align-items: flex-end;
    }

    /*========Rating=========*/
     .rating {
      display: flex;
      /* align items horizontally */
      justify-content: flex-start;
    }

    /* Style for the review count text */
    .review-count {
      margin-right: 10px;
      /* space between text and stars */
      font-size: 18px;
    }

    /* Hide radio buttons */
    .rating input {
      display: none;
    }

    .rating label {
      cursor: pointer;
      font-size: 40px;
      transition: color 0.3s;
      margin-right: 5px;
      /* spacing between stars */
    }

    .rating label:before {
      content: "\2605";/*star sympol*/ 
      font-size: 33px;
      text-align: center;
    }

    /* hover and checked effects */
    .rating input:checked~label,
    .rating label:hover,
    .rating label:hover~label {
      color: #ffd700;
    }

    .d-product-text p {
      color: #4d4d4d;
      margin: 10px 0px;
      font-size: 1.5rem;
      line-height: 2;
    }

    .d-product-text .price {
      color: #181818;
      font-size: 1.8rem;
      font-weight: 700;
    }

    .d-product-text .price del {
      color: #f80f0f;
      font-weight: 500;
      font-size: 1rem;
    }

    .d-product-text .quantity {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-top: 10px;
    }

    .d-product-text .quantity span {
      color: #363636;
      margin-right: 10px;
      font-weight: 500;
    }

    .d-product-text .quantity input {
      width: 70px;
      height: 40px;
      background-color: #fcf9fb;
      text-align: center;
      border: 1px solid #faa1d9;
      border-radius: 25px;
    }

    .d-product-text .button {
      width: 100%;
      height: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      color: #ffffff;
      background-color: #161616;
      margin-top: 20px;
      text-decoration: none;
    }

    .d-product-text .button:hover {
      background-color: #f39dcede;
      color: #ffffff;
      transition: all 0.3s ease;
    }

    .relative-products .product-heading {
      background-color: #f5f5f5;
      border: 30px solid rgb(236, 236, 236);
      padding: 10px 20px;
      border-radius: 5px;
    }

    /*==making-product-page-responsive============*/
     @media (max-width: 820px) {
      #product_details {
        grid-template-columns: 1fr;
      }

      .d-product-img {
        max-height: 400px;
      }

      .d-product-text {
        padding: 0px;
        margin-top: 30px;
      }
    }

    @media (max-width: 724px) {
      .d-product-text strong {
        font-size: 1.4rem;
      }
    }

    .d-product-text .category {
      margin-bottom: 10px;
    }

    .d-product-text strong {
      margin-bottom: 15px;
    }

    .d-product-text .rating {
      margin-bottom: 15px;
    }

    .d-product-text p {
      margin-bottom: 20px;
      line-height: 1.7;
    }

    .d-product-text .price {
      margin-bottom: 20px;
    }
  </style>
</head>
