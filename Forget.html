<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            background-color: rgba(227, 129, 181, 0.682);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
        }
   
        body::after {
            content: ' ';
            width: 100%;
            height: 100%;
            background: rgba(238, 201, 224, 0.197);
            position: absolute;
            clip-path: circle(60% at left 50%);
            /*to draw a shape use clip-path*/
            z-index: -1;
            /*to make the circle under the container*/
        }

        body::before {
            content: ' ';
            width: 100%;
            height: 100%;
            background:rgba(238, 201, 224, 0.197);
            position: absolute;
            clip-path: circle(60% at right 50%);
            /*to draw a shape use clip-path*/
            z-index: -1;
            /*to make the circle under the container*/
        }
        h1 a{
            font-style: italic;
            font-family:serif;
            color: rgb(230, 115, 176);
            text-decoration: none;
        }
        form {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            width: 40%;/*400px*/
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        form input {
            background-color: rgb(248, 207, 228);
            border: none;
            outline: none;
            color: rgb(240, 78, 180);
            border-radius: 30px;
            font-family: serif;
            padding: 10px 10px;
            flex-grow: 1;
            flex-basis: 100%;
        }
        form span{
            flex-grow: 1;
            line-height: 25px;
            text-align: center;
            color: rgb(255, 241, 250);
            font-size: 18px;
        }
        a{
            color: rgb(158, 29, 113); 
        }
        button {
            background-color: rgb(248, 207, 228);
            color: rgb(110, 2, 71);
            cursor: pointer;
            font-weight: bold;
            border-radius: 30px;
            border-color: rgb(253, 156, 211);
            flex-basis: 100%;
            flex-grow: 1;
            padding: 5px 8px;
        }
    </style>
    </style>
</head>

<body>
    <h1><a href="C:\Users\HP-ProBook\OneDrive\WEB\Bloom&Glow\Structure.html">Bloom&Glow</a></h1>
    <form id="registrationForm">
        <span>
            <b>Reset your password</b>
            <hr color="azure">
            Enter your email address below to recover your password. You will need to check your email to reset it:
        </span>
        <label for="email"></label>
        <input id="email"class="form" type="email" placeholder="Email" required>
        <button class="form">Submit</button>
        <span><a href="Login.html">Back</a></span> 
    </form>
    <div id="errorMessages" style="color:red;"></div>
    <script src="Dynamic.js"></script>
</body>

</html>
